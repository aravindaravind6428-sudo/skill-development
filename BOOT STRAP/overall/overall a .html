<!DOCTYPE html>
<html lang="en" ng-app="foodApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Food Hotel</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- AngularJS -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

<style>

body{
background:linear-gradient(135deg,#ff512f,#dd2476);
font-family:Arial,sans-serif;
}

.navbar{
background:black;
}

.hero{
height:90vh;
background:url('https://images.unsplash.com/photo-1513104890138-7c749659a591?w=1400');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero h1{
font-size:60px;
font-weight:bold;
text-shadow:3px 3px 8px black;
}

.hero p{
font-size:25px;
}

.food-card{
transition:0.5s;
border-radius:20px;
overflow:hidden;
}

.food-card:hover{
transform:translateY(-10px);
box-shadow:0 0 25px black;
}

.food-card img{
height:220px;
object-fit:cover;
}

.price{
font-size:22px;
color:red;
font-weight:bold;
}

.footer{
background:black;
color:white;
padding:20px;
margin-top:30px;
text-align:center;
}

</style>
</head>

<body ng-controller="foodController">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand fs-2">
🍔 FastFood Hotel
</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="#">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Menu</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Offers</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Contact</a>
</li>

</ul>

</div>
</div>
</nav>

<!-- Hero Section -->

<div class="hero">

<div>

<h1>🍟 Welcome To Fast Food Hotel</h1>

<p>Hot • Fresh • Tasty • Delivered Fast</p>

<button class="btn btn-warning btn-lg"
data-bs-toggle="modal"
data-bs-target="#offer">

Order Now

</button>

</div>

</div>

<!-- Search -->

<div class="container mt-5">

<input type="text"
class="form-control form-control-lg"
placeholder="Search Food..."
ng-model="searchFood">

</div>


<!-- Food Cards -->

<div class="container mt-5">

<div class="row">

<div class="col-md-4 mb-4"
ng-repeat="food in foods | filter:searchFood">

<div class="card food-card">

<img src="{{food.image}}">

<div class="card-body text-center">

<h3>{{food.name}}</h3>

<p>{{food.description}}</p>

<p class="price">
₹{{food.price}}
</p>

<input type="number"
class="form-control mb-2"
placeholder="Quantity">

<button class="btn btn-success w-100"
onclick="buyFood()">

<i class="bi bi-cart-fill"></i>
Add To Cart

</button>

</div>
</div>
</div>
</div>
</div>


<!-- Progress -->

<div class="container mt-5">

<h3>Order Delivery</h3>

<div class="progress">

<div class="progress-bar progress-bar-striped progress-bar-animated w-75">

75%

</div>

</div>

</div>


<!-- Contact Form -->

<div class="container mt-5">

<div class="card">

<div class="card-body">

<h2>Contact Us</h2>

<form>

<input type="text"
class="form-control mb-3"
placeholder="Name"
required>

<input type="email"
class="form-control mb-3"
placeholder="Email"
required>

<textarea
class="form-control mb-3"
placeholder="Message">
</textarea>

<button class="btn btn-primary">

Submit

</button>

</form>

</div>

</div>

</div>


<!-- Modal -->

<div class="modal fade" id="offer">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h3>Special Offer 🎉</h3>

<button class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

Get 30% OFF on all burgers today!

</div>

</div>

</div>

</div>


<!-- Footer -->

<div class="footer">

<h4>🍔 Fast Food Hotel © 2026</h4>

<p>
<i class="bi bi-facebook"></i>
<i class="bi bi-instagram"></i>
<i class="bi bi-whatsapp"></i>
</p>

</div>


<script>

var app=
angular.module("foodApp",[]);

app.controller(
"foodController",
function($scope){

$scope.foods=[

{
name:"Burger",
price:150,
description:"Cheesy burger",
image:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"
},

{
name:"Pizza",
price:299,
description:"Delicious pizza",
image:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500"
},

{
name:"French Fries",
price:120,
description:"Crispy fries",
image:"https://images.unsplash.com/photo-1576107232684-1279f390859f?w=500"
},

{
name:"Sandwich",
price:180,
description:"Loaded sandwich",
image:"https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500"
},

{
name:"Chicken Bucket",
price:499,
description:"Spicy chicken",
image:"https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=500"
},

{
name:"Soft Drink",
price:80,
description:"Cold drink",
image:"https://images.unsplash.com/photo-1581636625402-29b2a704ef13?w=500"
}

];

});

function buyFood(){

alert("Food added successfully!");

}

</script>

</body>
</html>
