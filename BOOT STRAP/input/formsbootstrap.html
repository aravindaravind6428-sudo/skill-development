<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap forms</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

<h2 class="text-center mb-4">Bootstrap All Components</h2>

<!-- Stack -->
<div class="vstack gap-3 mb-4">
    <div class="bg-primary text-white p-3">Stack Item 1</div>
    <div class="bg-success text-white p-3">Stack Item 2</div>
    <div class="bg-danger text-white p-3">Stack Item 3</div>
</div>

<!-- Form -->
<form>

<div class="mb-3">
<label>Name</label>
<input type="text" class="form-control" placeholder="Enter Name">
</div>

<!-- Select Menu -->
<div class="mb-3">
<label>Select Department</label>
<select class="form-select">
<option>Computer Science</option>
<option>IT</option>
<option>Mechanical</option>
<option>Civil</option>
</select>
</div>

<!-- Input Size -->
<div class="mb-3">
<input class="form-control form-control-lg mb-2" type="text" placeholder="Large Input">

<input class="form-control mb-2" type="text" placeholder="Default Input">

<input class="form-control form-control-sm" type="text" placeholder="Small Input">
</div>

<!-- Disabled -->
<div class="mb-3">
<input class="form-control" type="text" placeholder="Disabled Input" disabled>
</div>

<!-- Checkbox -->
<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">
Cricket
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">
Football
</label>
</div>

<br>

<!-- Radio -->
<div class="form-check">
<input class="form-check-input" type="radio" name="gender">
<label class="form-check-label">
Male
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="gender">
<label class="form-check-label">
Female
</label>
</div>

<br>

<!-- Toggle Switch -->
<div class="form-check form-switch">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">
Enable Notifications
</label>
</div>

<br>

<button class="btn btn-primary">
Submit
</button>

</form>

</div>

</body>
</html>
