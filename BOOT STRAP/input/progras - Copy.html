<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap Progress Bars</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>
<body>

<div class="container mt-5">

<h2 class="text-center mb-4">Bootstrap Progress Bars</h2>

<!-- Progress Bar Height -->
<h5>1. Progress Bar Height</h5>
<div class="progress" style="height:30px;">
  <div class="progress-bar" style="width:70%">70%</div>
</div>

<br>

<!-- Progress Bar Label -->
<h5>2. Progress Bar Label</h5>
<div class="progress">
  <div class="progress-bar" style="width:50%">
    50%
  </div>
</div>

<br>

<!-- Colored Progress Bars -->
<h5>3. Colored Progress Bars</h5>

<div class="progress mb-2">
  <div class="progress-bar bg-success" style="width:25%">
    Success
  </div>
</div>

<div class="progress mb-2">
  <div class="progress-bar bg-info" style="width:50%">
    Info
  </div>
</div>

<div class="progress mb-2">
  <div class="progress-bar bg-warning" style="width:75%">
    Warning
  </div>
</div>

<div class="progress">
  <div class="progress-bar bg-danger" style="width:90%">
    Danger
  </div>
</div>

<br>

<!-- Striped Progress Bar -->
<h5>4. Striped Progress Bar</h5>
<div class="progress">
  <div class="progress-bar progress-bar-striped bg-primary"
       style="width:70%">
       70%
  </div>
</div>

<br>

<!-- Animated Progress Bar -->
<h5>5. Animated Progress Bar</h5>
<div class="progress">
  <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
       style="width:80%">
       Loading...
  </div>
</div>

<br>

<!-- Multiple Progress Bars -->
<h5>6. Multiple Progress Bars</h5>
<div class="progress">
  
  <div class="progress-bar bg-success"
       style="width:30%">
       HTML
  </div>

  <div class="progress-bar bg-warning"
       style="width:40%">
       CSS
  </div>

  <div class="progress-bar bg-danger"
       style="width:30%">
       JS
  </div>

</div>

</div>

</body>
</html>
