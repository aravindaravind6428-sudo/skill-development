<!DOCTYPE html>
<html>
<head>
    <title>Buy Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: green;
        }

        button {
            background: green;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Order Successful 🎉</h1>

        <p>Thank you for buying our shoes.</p>

        <a href="index.html">
            <button>Back to Shop</button>
        </a>

    </div>

</body>
</html>
