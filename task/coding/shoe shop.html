<!DOCTYPE html>
<html>
<head>
    <title> Shoe Shop</title>

    <link rel="stylesheet" href="C:\Users\Aravind\shoe shop2.html">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .shop {
            width: 300px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .shop img {
            width: 100%;
            border-radius: 10px;
        }

        .shop h2 {
            color: #222;
        }

        .price {
            font-size: 20px;
            color: green;
            font-weight: bold;
        }

        button {
            background: green;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            
        }
    

        button:hover {
            background: darkgreen;
        }
    </style>
</head>

<body>

    <h1> Shoe Shop</h1>

    <div class="container">

        <!-- Shoe 1 -->
        <div class="shop">
            <img src="C:\Users\Aravind\Downloads\shopping.webp" alt="Cool Shoes">

            <h2>Cool Shoes</h2>

            <p class="price">₹999</p>

            <button>Buy Now</button>
        </div>

        <!-- Shoe 2 -->
        <div class="shop">
            <img src="C:\Users\Aravind\Downloads\shopping (1).webp" alt="Running Shoes">

            <h2>Running Shoes</h2>

            <p class="price">₹1499</p>

            <button>Buy Now</button>
        </div>

        <!-- Shoe 3 -->
        <div class="shop">
            <img src="C:\Users\Aravind\Downloads\shopping (2).webp" alt="Sports Shoes">

            <h2>Sports Shoes</h2>

            <p class="price">₹1999</p>

            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
