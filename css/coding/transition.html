<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All CSS Transitions</title>
    <link rel="stylesheet" href="C:\Users\Aravind\transition.css">
    <style>

        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f0f0;
        }

        .box{
            width: 200px;
            height: 200px;
            background-color: royalblue;
            margin: auto;
            line-height: 200px;
            color: white;
            font-size: 20px;
            border-radius: 10px;

            /* Transition */
            transition: all 1s ease-in-out 0.2s;
        }

        .box:hover{
            width: 300px;
            height: 250px;
            background-color: crimson;
            color: yellow;
            border-radius: 50px;
            transform: rotate(10deg) scale(1.1);
            box-shadow: 0 0 20px gray;
        }

        button{
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            background-color: green;
            color: white;
            border-radius: 5px;
            cursor: pointer;

            transition: all 0.5s linear;
        }

        button:hover{
            background-color: darkgreen;
            transform: scale(1.2);
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <h1>CSS Transition </h1>

    <div class="box">
        Hover Me
    </div>

    <button>Click Button</button>

</body>
</html>
