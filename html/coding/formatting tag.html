<h1> Formatting Tags</h1>

<p>This is a <b>bold</b> word.</p>
<p>This is an <i>italic</i> word.</p>
<p>This is <u>underlined</u>.</p>
<p>Water formula: H<sub>2</sub>O</p>
<p>Math formula: x<sup>2</sup></p>

<hr>

<p><mark>Highlighted text</mark></p>
